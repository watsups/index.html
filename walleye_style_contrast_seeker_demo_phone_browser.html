<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contrast-Seeker (Walleye-style) Demo</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0b0f;color:#eaeaf2}
    header{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .wrap{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
    .stage{position:relative;display:grid;place-items:center;padding:10px}
    canvas{max-width:100vw;max-height:70vh;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.45);background:#000}
    .hud{position:absolute;top:18px;left:18px;right:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;pointer-events:none}
    .pill{pointer-events:none;background:rgba(20,20,28,.72);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(8px);padding:8px 10px;border-radius:999px;font-size:12px}
    footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .controls>*{background:#141421;border:1px solid rgba(255,255,255,.10);color:#eaeaf2;border-radius:10px;padding:10px 12px;font-size:14px}
    button{cursor:pointer}
    input[type="range"]{padding:10px 8px}
    label{display:flex;gap:10px;align-items:center}
    small{opacity:.8}
    a{color:#9dd1ff}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">
      <div>
        <div style="font-weight:700">Contrast seeker demo (Walleye-style)</div>
        <small>Tap the video to lock. It tracks the strongest <b>edge/contrast</b> nearby each frame.</small>
      </div>
      <small>Tip: aim at strong edges (door frames, text on a box, etc.).</small>
    </div>
  </header>

  <div class="stage">
    <canvas id="c" width="640" height="480"></canvas>
    <div class="hud">
      <div class="pill" id="status">Status: idle</div>
      <div class="pill" id="readout">—</div>
    </div>
    <video id="v" playsinline muted style="display:none"></video>
  </div>

  <footer>
    <div class="controls">
      <button id="start">Start camera</button>
      <button id="lock" disabled>Lock / Unlock</button>

      <label>Search window
        <input id="win" type="range" min="15" max="120" value="55" />
        <span id="winVal">55</span>
      </label>

      <label>Edge threshold
        <input id="thr" type="range" min="5" max="120" value="25" />
        <span id="thrVal">25</span>
      </label>

      <label>AGC (auto contrast)
        <input id="agc" type="checkbox" checked />
      </label>

      <small>Runs fully offline in your browser. No uploads.</small>
    </div>
  </footer>
</div>

<script>
(() => {
  /**
   * What this does (simple):
   * 1) Draw camera frame to canvas
   * 2) (Optional) normalize contrast (AGC)
   * 3) Compute a cheap edge map (Sobel-ish gradient)
   * 4) If locked: in a window around last target, find max edge strength
   * 5) Track that point, and show error vector to center
   */

  const video = document.getElementById('v');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const statusEl = document.getElementById('status');
  const readoutEl = document.getElementById('readout');

  const startBtn = document.getElementById('start');
  const lockBtn  = document.getElementById('lock');
  const winR     = document.getElementById('win');
  const thrR     = document.getElementById('thr');
  const agcC     = document.getElementById('agc');

  const winVal = document.getElementById('winVal');
  const thrVal = document.getElementById('thrVal');

  winR.addEventListener('input', () => winVal.textContent = winR.value);
  thrR.addEventListener('input', () => thrVal.textContent = thrR.value);

  let stream = null;
  let running = false;
  let locked = false;

  // target point (in canvas coords)
  let tx = canvas.width / 2;
  let ty = canvas.height / 2;

  // For a little smoothing like real seekers
  const SMOOTH = 0.35; // 0 = no smoothing; 1 = heavy smoothing

  // Tap-to-designate
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top)  * (canvas.height / rect.height);
    tx = clamp(x, 0, canvas.width - 1);
    ty = clamp(y, 0, canvas.height - 1);
    locked = true;
    lockBtn.textContent = 'Unlock';
    statusEl.textContent = 'Status: LOCKED (tap to re-designate)';
  });

  lockBtn.addEventListener('click', () => {
    locked = !locked;
    lockBtn.textContent = locked ? 'Unlock' : 'Lock';
    statusEl.textContent = locked ? 'Status: LOCKED (tap to re-designate)' : 'Status: tracking off';
  });

  startBtn.addEventListener('click', async () => {
    if (stream) {
      // stop
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      running = false;
      locked = false;
      lockBtn.disabled = true;
      lockBtn.textContent = 'Lock / Unlock';
      startBtn.textContent = 'Start camera';
      statusEl.textContent = 'Status: idle';
      ctx.clearRect(0,0,canvas.width,canvas.height);
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      // Fit canvas to video aspect
      const vw = video.videoWidth || 1280;
      const vh = video.videoHeight || 720;
      const aspect = vw / vh;
      const baseW = 720;
      canvas.width = baseW;
      canvas.height = Math.round(baseW / aspect);

      tx = canvas.width / 2;
      ty = canvas.height / 2;

      running = true;
      lockBtn.disabled = false;
      startBtn.textContent = 'Stop camera';
      statusEl.textContent = 'Status: ready (tap to lock)';

      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Status: camera failed (permission?)';
    }
  });

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function loop() {
    if (!running || !stream) return;

    // Draw frame
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Read pixels
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const { data, width: W, height: H } = frame;

    // Convert to grayscale and (optional) AGC normalize
    // We'll store grayscale in-place into a Float32Array for speed.
    const gray = new Float32Array(W * H);

    let gMin = 255, gMax = 0;
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      // Luma (cheap)
      const g = 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
      gray[p] = g;
      if (g < gMin) gMin = g;
      if (g > gMax) gMax = g;
    }

    if (agcC.checked) {
      const span = Math.max(1, gMax - gMin);
      for (let p = 0; p < gray.length; p++) {
        gray[p] = 255 * (gray[p] - gMin) / span;
      }
    }

    // Edge strength (simple gradient magnitude)
    // Use a Sobel-ish 3x3 approximation
    const edge = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const p = y * W + x;

        // Sobel kernels (Gx, Gy) simplified
        const a00 = gray[p - W - 1], a01 = gray[p - W], a02 = gray[p - W + 1];
        const a10 = gray[p - 1],     a12 = gray[p + 1];
        const a20 = gray[p + W - 1], a21 = gray[p + W], a22 = gray[p + W + 1];

        const gx = (-a00 + a02) + (-2*a10 + 2*a12) + (-a20 + a22);
        const gy = (-a00 - 2*a01 - a02) + (a20 + 2*a21 + a22);
        edge[p] = Math.sqrt(gx*gx + gy*gy);
      }
    }

    // If locked, search for the strongest edge near the last target
    const win = parseInt(winR.value, 10);
    const thr = parseInt(thrR.value, 10);

    let bestX = tx, bestY = ty, bestE = 0;

    if (locked) {
      const x0 = Math.floor(clamp(tx - win, 1, W - 2));
      const x1 = Math.floor(clamp(tx + win, 1, W - 2));
      const y0 = Math.floor(clamp(ty - win, 1, H - 2));
      const y1 = Math.floor(clamp(ty + win, 1, H - 2));

      for (let y = y0; y <= y1; y++) {
        let row = y * W;
        for (let x = x0; x <= x1; x++) {
          const e = edge[row + x];
          if (e > bestE) {
            bestE = e;
            bestX = x;
            bestY = y;
          }
        }
      }

      // Reject weak contrast so it doesn't chase noise
      if (bestE >= thr) {
        tx = tx * SMOOTH + bestX * (1 - SMOOTH);
        ty = ty * SMOOTH + bestY * (1 - SMOOTH);
      }
    }

    // Overlay HUD
    drawOverlay(bestE, thr);

    requestAnimationFrame(loop);
  }

  function drawOverlay(bestE, thr) {
    const W = canvas.width, H = canvas.height;

    // Crosshair center
    const cx = W / 2, cy = H / 2;

    // Draw crosshair
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,255,140,.95)';

    ctx.beginPath();
    ctx.moveTo(cx - 18, cy); ctx.lineTo(cx + 18, cy);
    ctx.moveTo(cx, cy - 18); ctx.lineTo(cx, cy + 18);
    ctx.stroke();

    // Target box
    ctx.strokeStyle = locked ? 'rgba(255,230,120,.95)' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = 2;
    const box = 26;
    ctx.strokeRect(tx - box/2, ty - box/2, box, box);

    // Error vector to center (like a guidance error)
    const ex = tx - cx;
    const ey = ty - cy;
    ctx.strokeStyle = 'rgba(255,90,90,.95)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // Little text
    const mag = Math.hypot(ex, ey);
    readoutEl.textContent = locked
      ? `Edge=${bestE.toFixed(1)} (thr ${thr}) | error=${mag.toFixed(1)} px`
      : 'Tap the video to lock onto a high-contrast edge';

    ctx.restore();
  }
})();
</script>
</body>
</html>
